# Expose the system-wide GE-Proton build baked into the image
# (/usr/share/steam/compatibilitytools.d) to Steam, so it shows up in the
# "Force the use of a specific Steam Play compatibility tool" list.
STEAM_EXTRA_COMPATIBILITY_PATHS=/usr/share/steam/compatibilitytools.d
