# System-wide MangoHud default configuration. MangoHud only activates when a
# game is launched with `mangohud` / `MANGOHUD=1`, or when the overlay is
# toggled at runtime; this file just defines what is shown then.
# Users can override it in ~/.config/MangoHud/MangoHud.conf.

fps
frame_timing
gpu_stats
cpu_stats
ram
vram
vulkan_driver
opengl_driver
engine_version
wine
gamemode
# Toggle the overlay at runtime with Shift_R+F12
toggle_hud=Shift_R+F12
