# Gaming and Windows-compatibility layer packages.
#
# Target hardware: mid-range 2022/2023 PCs (e.g. 11th gen Intel Core i5 with
# Intel UHD / Iris Xe integrated graphics). The multilib repository is enabled
# by build.sh, so the lib32-* packages below install fine.

[Content]
Packages=
    # Gaming core: launcher, performance and overlay tooling
    steam # Valve's game launcher; Proton runs Windows games through it
    gamemode # On-demand performance optimizations requested by games
    lib32-gamemode # 32-bit counterpart so older games can use GameMode too
    mangohud # FPS / temperature / usage overlay for games
    lib32-mangohud # 32-bit counterpart for older games
    goverlay # GUI for configuring MangoHud and other overlays
    gamescope # Valve's gaming micro-compositor (frame limiting, FSR scaling)

    # Windows compatibility: Wine and friends for non-Steam Windows software
    wine # Run Windows applications and games
    wine-gecko # Rendering engine for HTML in Wine (pulls with Wine usually)
    wine-mono # .NET implementation for Wine
    winetricks # Helper to install common Windows runtime components
    protontricks # winetricks wrapper for Proton/Steam game prefixes
    vkd3d # Direct3D 12 -> Vulkan translation layer for Wine
    dosbox # DOS emulator for pre-Windows retro games

    # 32-bit graphics runtime: most Windows games are 32-bit, and on Intel
    # iGPUs they need the 32-bit Mesa/ANV drivers to get hardware acceleration
    lib32-mesa # 32-bit Mesa (OpenGL/Vulkan userspace drivers)
    lib32-vulkan-intel # 32-bit Vulkan driver for Intel GPUs (ANV)

    # Intel graphics: diagnostics, OpenCL and status tools (11th gen "Tiger
    # Lake" and later are fully supported by these)
    intel-gpu-tools # intel_gpu_top and friends; load/testing tools for i915
    intel-compute-runtime # Intel OpenCL / Level Zero driver (Gen12+)
    clinfo # Print OpenCL platform and device information
    vulkan-tools # vulkaninfo, vkcube; verify Vulkan initialization works
    mesa-utils # glxinfo/glxgears; verify OpenGL direct rendering works

    # Hardware diagnostics and support tools
    dmidecode # Dump DMI/SMBIOS tables (model, BIOS, memory part numbers)
    lm_sensors # Temperature, voltage and fan sensors
    smartmontools # S.M.A.R.T. health monitoring for disks
    glmark2 # OpenGL benchmark to sanity-check graphics performance
    v4l-utils # Webcam/V4L2 diagnostics (qv4l2, v4l2-ctl)

    # Network / WiFi diagnostics
    ethtool # Query and tweak ethernet/WiFi driver settings
    mtr # Combined ping/traceroute for connection quality debugging
    wavemon # NCurses monitor for WiFi signal quality and link stats

    # Read/write support for NTFS volumes coming from Windows machines
    ntfs-3g # FUSE-based NTFS driver with full read/write support
